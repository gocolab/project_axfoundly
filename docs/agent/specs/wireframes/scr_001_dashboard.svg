    <rect x="924" y="644" width="90" height="24" rx="4" fill="none" stroke="#64748B"/><text x="969" y="661" font-size="11.5" text-anchor="middle" fill="#475569">예외 등록</text>
    <rect x="924" y="678" width="90" height="24" rx="4" fill="none" stroke="#64748B"/><text x="969" y="695" font-size="11.5" text-anchor="middle" fill="#475569">예외 등록</text>
