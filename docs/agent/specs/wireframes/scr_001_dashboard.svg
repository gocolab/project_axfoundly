  <rect x="924" y="228" width="336" height="288" fill="none" stroke="#94A3B8"/>
  <text x="940" y="252" font-size="13.5" font-weight="bold" fill="#334155">실시간 이벤트 (API-008 WS)</text>
  <g font-size="11.5" fill="#475569">
    <text x="940" y="280">17:41  📸 cam_12f_1 포착 — 김OO (94.2%)</text>
    <text x="940" y="304">17:41  ✉ 복귀 요청 문자 발송 — 김OO</text>
    <text x="940" y="328">17:38  ✅ 퇴실 태그 — 박OO</text>
    <text x="940" y="352">17:35  📸 cam_1f 포착 — 미매칭 (61.0%)</text>
    <text x="940" y="376">…(최대 50건 유지, 시간 역순)</text>
