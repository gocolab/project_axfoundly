    <text x="244" y="660">이OO</text><text x="360" y="660">자바개발</text><text x="520" y="660">09:01</text><text x="650" y="660">8h 41m</text><text x="760" y="660">외출(15~16시)</text>
    <text x="244" y="694">최OO</text><text x="360" y="694">AI솔루션</text><text x="520" y="694">08:47</text><text x="650" y="694">8h 55m</text><text x="760" y="694">—</text>
